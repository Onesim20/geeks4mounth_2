{% extends "base.html" %}

{% block title %}Категории — Blog{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Категории</h1>

<div class="list-group">
    {% for category in category_list %}
    <a href="{% url 'article_list' %}?category={{ category.pk }}"
       class="list-group-item list-group-item-action">{{ category.name }}</a>
    {% empty %}
    <div class="alert alert-light border mb-0">Категорий пока нет.</div>
    {% endfor %}
</div>
{% endblock %}
