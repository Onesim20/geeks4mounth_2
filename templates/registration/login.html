{% extends "base.html" %}

{% block title %}Вход — Blog{% endblock %}
{% block sidebar %}{% endblock %}
{% block extra_css %}
<style>
  .auth-form input:not([type="hidden"]) {
    display: block; width: 100%; padding: .375rem .75rem;
    border: 1px solid var(--bs-border-color); border-radius: var(--bs-border-radius);
    background-color: var(--bs-body-bg); color: var(--bs-body-color);
  }
  .auth-form input:focus { outline: 0; border-color: #86b7fe; box-shadow: 0 0 0 .25rem rgba(13, 110, 253, .25); }
</style>
{% endblock %}

{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 480px;">
  <div class="card-body p-4">
    <h1 class="h4 mb-4">Вход</h1>

    <form method="post" class="auth-form" novalidate>
      {% csrf_token %}
      {% include "includes/auth_form.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100">Войти</button>
    </form>

    <hr>
    <div class="d-flex justify-content-between small">
      <a href="{% url 'password_reset' %}">Забыли пароль?</a>
      <a href="{% url 'signup' %}">Регистрация</a>
    </div>
  </div>
</div>
{% endblock %}
